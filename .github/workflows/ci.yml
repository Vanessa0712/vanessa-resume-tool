name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: resume-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: resume-tool/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 空数据目录回归测试
        env:
          RESUME_TOOL_DATA_DIR: ${{ runner.temp }}/resume-tool-ci-data
          RESUME_TOOL_SKIP_MIGRATION: "1"
        run: python -m unittest discover -s tests -p "test*.py" -v
